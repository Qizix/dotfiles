# See https://wiki.hyprland.org/Configuring/Monitors/

monitor=HDMI-A-1,2560x1440@144,0x0,auto
monitor=HDMI-A-2,1280x1024@60,2560x240,auto

# Set programs that you use
$terminal = kitty
$fileManager = nemo
$menu = wofi #fuzzel

exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = mako
exec-once = hyprctl dispatch workspace 11
exec-once = hyprctl dispatch workspace 1
exec-once = swww-daemon
exec-once = ~/.config/hypr/scripts/chage_bg.sh
exec-once = waybar

exec-once = wl-paste -t text --watch clipman store --no-persist
exec-once = wl-paste -p -t text --watch clipman store -P --histpath="~/.local/share/clipman-primary.json"
exec-once = clipman restore

exec-once = gpu-screen-recorder -w screen -f 60 -a default_output -c mkv -r 60 -df yes -restart-replay-on-save yes -o "$HOME/Videos/pc_recs" -a "default_output|default_input"

# Some default env vars.
env = WLR_NO_HARDWARE_CURSORS,1
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = WLR_DRM_NO_ATOMIC,1 # some nvidia fix
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = GBM_BACKEND,nvidia-drm
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_THEME,"Bibata-Modern-Classic"
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,64
env = XDG_CURRENT_DESKTOP,Hyprland
env = MOZ_DISABLE_RDD_SANDBOX,1
env = EGL_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = GTK_IM_MODULE,gtk-im-context-simple

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
  kb_layout = us, ua
  kb_variant =
  kb_model =
  kb_options = grp:alt_shift_toggle
  kb_rules =

  follow_mouse = 1

  touchpad {
    natural_scroll = no
  }

  sensitivity = -0.4 # -1.0 - 1.0, 0 means no modification.
}

general {
  # See https://wiki.hyprland.org/Configuring/Variables/ for more

  gaps_in = 5
  gaps_out = 10

  border_size = 2
  # col.active_border = rgba(7dd3fcee) rgba(0369a1ee) 45deg

  # col.inactive_border = rgba(262626ee)
  col.active_border = rgb(504945)   # muted dark brown-grey
  col.inactive_border = rgb(3c3836) # very dark grey

  # layout = dwindle
  layout = dwindle

  # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
  allow_tearing = false
}

decoration {
  # See https://wiki.hyprland.org/Configuring/Variables/ for more

  rounding = 0

  blur {
    enabled = true
    size = 12
    passes = 4
    new_optimizations = true
  }

  # drop_shadow = no
  # shadow_range = 4
  # shadow_render_power = 3
  # col.shadow = rgba(1a1a1aee)
}

animations {
  enabled = yes

  bezier = defaultBezier, 0.05, 0.9, 0.1, 1

  animation = windows, 1, 5, defaultBezier
  animation = windowsOut, 1, 5, default, popin 80%
  animation = border, 1, 10, default
  animation = borderangle, 1, 8, default
  animation = fade, 1, 7, default
  animation = workspaces, 1, 4, defaultBezier
}

dwindle {
  # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
  pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  preserve_split = yes # you probably want this
}

master {
  # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
  mfact = 0.5
}

misc {
  # See https://wiki.hyprland.org/Configuring/Variables/ for more
  force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
# device:epic-mouse-v1 {
#   sensitivity = -0.5
# }

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2

# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# windowrulev2 = nomaximizerequest, class:.* # You'll probably like this.
windowrulev2 = float,class:^(pomodorolm)$,title:^(Pomodorolm)$

# === GAMES ON MONITOR 0 ===
windowrulev2 = monitor 0, class:^(steam)$
windowrulev2 = monitor 0, class:^(steam_app_.*)$
windowrulev2 = monitor 0, title:^(Dota 2)$
windowrulev2 = monitor 0, title:^(The Witcher.*)$
windowrulev2 = monitor 0, title:^(Hades.*)$

# === COMMUNICATION APPS ON MONITOR 1 ===
windowrulev2 = monitor 1, class:^(discord)$
windowrulev2 = monitor 1, class:^(TelegramDesktop)$

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER
# Translator
bind = CTRL ALT, Q, exec, notify-send -c translation -i google-translate -t 13000 "$(trans -t uk -brief -no-ansi "$(wl-paste)")"
bind = CTRL ALT, E, exec, notify-send -c translation -i google-translate -t 13000 "$(trans -t uk -show-alternatives n -show-dictionary n -show-original-dictionary Y -show-prompt-message n -show-languages n -show-translation-phonetics n -show-original-phonetics Y -no-ansi "$(wl-paste)")"
bind = CTRL ALT, W, exec, grimblast --freeze save area /tmp/scanned && tesseract -l eng+deu+equ+fra+osd /tmp/scanned /tmp/scannedText && wl-copy $(cat /tmp/scannedText.txt)

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for moref
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive
bind = $mainMod, O, exec, code
bind = $mainMod, Y, exec, kitty yazi
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, T, togglesplit, # dwindle
bind = $mainMod, I, pseudo, # dwindle
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod SHIFT, B, exec, sh -c "killall waybar 2>/dev/null; waybar &"
bind = ALT, F4, exec, wlogout -L 800 -R 800 -T 400 -B 400
bind = $mainMod, A, exec, zen-browser
bind = $mainMod SHIFT, A, exec, google-chrome-stable
bind = $mainMod, backslash, exec, "${HOME}/.config/hypr/scripts/layout.sh"
bind = $mainMod SHIFT, backslash, exec, "${HOME}/.config/hypr/scripts/layout2.sh"
bind = $mainMod SHIFT, H, exec, pgrep -x wofi >/dev/null && pkill -x wofi || clipman pick -t wofi

# Night mode
bind = $mainMod, N, exec, bash -c 'pgrep -x hyprsunset && pkill hyprsunset || hyprsunset -t 3500 &'
bind = $mainMod SHIFT, N, exec, bash -c 'pgrep -x hyprsunset && pkill hyprsunset || hyprsunset -t 2500 &'

# Mute
bind = $mainMod, grave, exec, ~/.config/hypr/scripts/mic_toggle.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, up, movefocus, u

# Move focus with mainMod + hjkl
bind = $mainMod, J, movefocus, l
bind = $mainMod, H, movefocus, u
bind = $mainMod, L, movefocus, d
bind = $mainMod, K, movefocus, r

# Screen recording
# Save last 2 minutes to ~/Videos/replay-<timestamp>.mp4
bind = ALT, f10, exec, sh -c 'kill -s SIGRTMIN+3 $(pidof gpu-screen-recorder) && notify-send -t 3000 "🎥 GPU Screen Recorder" "Saved last 60 s to ~/Videos/pc_recs/"'
bind = $mainMod, f10, exec, kitty yazi ~/Videos/pc_recs/

# FOR HYPRSOME (MULTIPLE MONITORS)
workspace=1,monitor:HDMI-A-1
workspace=2,monitor:HDMI-A-1
workspace=3,monitor:HDMI-A-1
workspace=4,monitor:HDMI-A-1
workspace=5,monitor:HDMI-A-1
workspace=6,monitor:HDMI-A-1
workspace=7,monitor:HDMI-A-1
workspace=8,monitor:HDMI-A-1
workspace=9,monitor:HDMI-A-1
workspace=10,monitor:HDMI-A-1

workspace=11,monitor:HDMI-A-2
workspace=12,monitor:HDMI-A-2
workspace=13,monitor:HDMI-A-2
workspace=14,monitor:HDMI-A-2
workspace=15,monitor:HDMI-A-2
workspace=17,monitor:HDMI-A-2
workspace=18,monitor:HDMI-A-2
workspace=19,monitor:HDMI-A-2
workspace=110,monitor:HDMI-A-2

# switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, hyprsome workspace 1
bind = $mainMod, 2, exec, hyprsome workspace 2
bind = $mainMod, 3, exec, hyprsome workspace 3
bind = $mainMod, 4, exec, hyprsome workspace 4
bind = $mainMod, 5, exec, hyprsome workspace 5
bind = $mainMod, 6, exec, hyprsome workspace 6
bind = $mainMod, 7, exec, hyprsome workspace 7
bind = $mainMod, 8, exec, hyprsome workspace 8
bind = $mainMod, 9, exec, hyprsome workspace 9
bind = $mainMod, 0, exec, hyprsome workspace 10

# move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, exec, hyprsome move 1
bind = $mainMod SHIFT, 2, exec, hyprsome move 2
bind = $mainMod SHIFT, 3, exec, hyprsome move 3
bind = $mainMod SHIFT, 4, exec, hyprsome move 4
bind = $mainMod SHIFT, 5, exec, hyprsome move 5
bind = $mainMod SHIFT, 6, exec, hyprsome move 6
bind = $mainMod SHIFT, 7, exec, hyprsome move 7
bind = $mainMod SHIFT, 8, exec, hyprsome move 8
bind = $mainMod SHIFT, 9, exec, hyprsome move 9
bind = $mainMod SHIFT, 0, exec, hyprsome move 10

windowrulev2 = opacity 0.0 override 0.0 override,class:^(xwaylandvideobridge)$
windowrulev2 = noanim,class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus,class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1,class:^(xwaylandvideobridge)$
windowrulev2 = noblur,class:^(xwaylandvideobridge)$

# screenshot keybind
bind = $mainMod, S, exec, setxkbmap en && GRIMBLAST_HIDE_CURSOR=0 grimblast --notify --freeze copysave output

# screenshot + crop keybind
bind = $mainMod SHIFT, S, exec, grimblast --notify --freeze save area - | swappy -f -

