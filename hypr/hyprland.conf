# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%

bind = , XF86AudioMute, exec, pamixer -t

bind = $mainMod, M, exec, xdg-open https://music.youtube.com
bind = $mainMod SHIFT, M, exec, xdg-open https://maps.google.com

bind = $mainMod, Z, exec, xdg-open https://chat.openai.com

bind = $mainMod, G, exec, xdg-open https://gmail.com

bind = $mainMod, P, exec, xdg-open https://pomofocus.io

bind = $mainMod, F9, exec, xdg-open https://dota2protracker.com/

# $mainMod + SHIFT + Z → Open ChatGPT in Google Chrome specifically
bind = $mainMod SHIFT, Z, exec, google-chrome-stable https://chat.openai.com

bind = $mainMod, B, exec, obsidian

# $mainMod + F1 → Open color picker (requires wl-color-picker)
bind = $mainMod, F1, exec, wl-color-picker

# $mainMod + , → Dismiss all notifications (requires makoctl or swaync-client)
bind = $mainMod, comma, exec, makoctl dismiss -a || swaync-client --dismiss-all

# $mainMod + LEFT → Previous media track
bind = $mainMod, left, exec, playerctl previous

# $mainMod + DOWN → Play-pause media track
bind = $mainMod, down, exec, playerctl play-pause

# $mainMod + RIGHT → Next media track
bind = $mainMod, right, exec, playerctl next

# $mainMod + CTRL + E → Open emoji picker (requires wl-clipboard + bemenu or fuzzel)
bind = $mainMod CTRL, E, exec, wofi-emoji

bind = $mainMod, F2, exec, bash -lc 'sleep 0.2; wtype "yar.dziub2005@gmail.com"'
bind = $mainMod, F3, exec, bash -lc 'sleep 0.2; wtype "yaroslav.dziubenko.ai@gmail.com"'
bind = $mainMod, F5, exec, bash -lc 'sleep 0.2; wtype "+380963480378"'
bind = $mainMod, F4, exec, bash -lc 'sleep 0.1; wtype "—"'

# HyprPrompts - Snippet utility (change keybind if needed)
bind = $mainMod SHIFT, P, exec, ~/.config/hyprprompts/target/release/hyprprompts
