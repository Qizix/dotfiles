[plugin]
prepend_previewers = [
    { name = "*.csv", run = "rich-preview" },
    { name = "*.md", run = "rich-preview" },
    { name = "*.rst", run = "rich-preview" },
    { name = "*.ipynb", run = "rich-preview" },
    { name = "*.json", run = "rich-preview" }
]

[preview]
max_width = 10000
max_height = 10000
image_quality = 90
use = ["layout"]

# --- Separate openers ---

[opener]
# 🖼️ Image openers
image = [
  { run = 'swayimg "$@"', desc = "Swayimg", orphan = true, for = "unix" },
  { run = 'feh "$@"', desc = "Feh", orphan = true, for = "unix" },
  { run = 'gimp "$@"', desc = "GIMP", for = "unix" },
  { run = 'pinta "$@"', desc = "Pinta", for = "unix" }
]

# 📄 General opener (for PDFs and others)
default = [
  { run = 'xdg-open "$@"', desc = "System Default", for = "unix" }
]

[open]
prepend_rules = [
  # Images → use image openers
  { name = "*.png", use = ["image"] },
  { name = "*.jpg", use = ["image"] },
  { name = "*.jpeg", use = ["image"] },
  { name = "*.gif", use = ["image"] },
  { name = "*.bmp", use = ["image"] },
  { name = "*.webp", use = ["image"] }
]

append_rules = [
  # Everything else → use system default
  { name = "*", use = "default" }
]
